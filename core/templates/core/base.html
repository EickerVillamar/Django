<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-gray-800 p-4 text-white flex gap-4">
        <a href="/productos/" class="hover:text-gray-300">Productos</a>
        <a href="/crear-producto/" class="hover:text-gray-300">Crear producto</a>
    </nav>

    <div class="container mx-auto mt-10 px-4">
        
        <!-- Bloque de Mensajes con botón de cerrar -->
        {% if messages %}
            {% for message in messages %}
                <div class="relative mb-4 p-4 rounded shadow-md border-l-4 flex justify-between items-center
                    {% if message.tags == 'success' %} bg-green-100 text-green-800 border-green-500
                    {% elif message.tags == 'error' %} bg-red-100 text-red-800 border-red-500
                    {% else %} bg-blue-100 text-blue-800 border-blue-500 {% endif %}" 
                    role="alert" id="msg-{{ forloop.counter }}">
                    
                    <span>{{ message }}</span>

                    <!-- Botón X -->
                    <button onclick="document.getElementById('msg-{{ forloop.counter }}').remove()" 
                            class="ml-4 text-xl font-bold hover:opacity-50">
                        &times;
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
        
    </div>

    <!-- Script opcional: los mensajes desaparecen solos después de 4 segundos -->
    <script>
        setTimeout(() => {
            const messages = document.querySelectorAll('[id^="msg-"]');
            messages.forEach(msg => {
                msg.style.transition = "opacity 0.5s";
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 500);
            });
        }, 4000);
    </script>
</body>
</html>
