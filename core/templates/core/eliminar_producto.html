{% extends "core/base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-red-50 border-t-4 border-red-500 p-8 rounded shadow">
  <h1 class="text-2xl font-bold mb-4 text-red-700">Eliminar producto</h1>

  <p class="text-gray-700 mb-6">
    ¿Estás seguro de que deseas eliminar permanentemente <strong>"{{ producto.nombre }}"</strong>? Esta acción no se puede deshacer.
  </p>

  <form method="POST" class="flex items-center gap-4">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 transition">
      Sí, eliminar definitivamente
    </button>
    <a href="/productos/" class="text-gray-600 hover:underline">
      Cancelar y volver
    </a>
  </form>
</div>
{% endblock %}
