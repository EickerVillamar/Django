{% extends "core/base.html" %}

{% block content %}
  <h1 class="text-3xl font-bold mb-6">
    Lista de productos
  </h1>

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <a href="/crear-producto/" class="bg-blue-500 text-white px-4 py-2 rounded inline-block">
      Crear producto
    </a>

    <!-- Barra de búsqueda integrada -->
    <form method="GET" class="flex gap-2 w-full md:w-1/3">
      <input 
        type="text" 
        name="q" 
        placeholder="Buscar producto..." 
        value="{{ request.GET.q }}"
        class="border p-2 rounded w-full" 
      />
      <button class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700 transition">
        Buscar
      </button>
    </form>
  </div>


  <ul class="mt-6 space-y-2">
    {% for producto in productos %}
      <li class="bg-white p-4 rounded shadow flex justify-between">
        <div>
          {{ producto.nombre }} - ${{ producto.precio }}
        </div>

        <div class="flex gap-2">
          <a href="/editar-producto/{{ producto.id }}/" class="text-blue-500 ">
            Editar
          </a>
          <a href="/eliminar-producto/{{ producto.id }}/" class="text-red-500">
            Eliminar
          </a>
        </div>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
